<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'">
<title>marohwp</title>
<link rel="icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./styles.css">
<style id="shape-css"></style>
</head>
<body>
<div id="app">
  <nav id="menubar" role="menubar" aria-label="메뉴">
    <div class="menu" data-menu="file"><button class="menu-title" type="button">파일</button></div>
    <div class="menu" data-menu="edit"><button class="menu-title" type="button">편집</button></div>
    <div class="menu" data-menu="view"><button class="menu-title" type="button">보기</button></div>
    <div class="menu" data-menu="insert"><button class="menu-title" type="button">입력</button></div>
    <div class="menu" data-menu="format"><button class="menu-title" type="button">서식</button></div>
    <div class="menu" data-menu="table"><button class="menu-title" type="button">표</button></div>
    <div class="menu" data-menu="help"><button class="menu-title" type="button">도움말</button></div>
  </nav>

  <div id="toolbar" role="toolbar" aria-label="도구 모음">
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="file.new" title="새 문서 (Ctrl+N)"><svg viewBox="0 0 20 20"><path d="M5 2.5h6.5L15.5 6.5V17.5H5z M11.5 2.5V6.5H15.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button type="button" class="tb" data-cmd="file.open" title="불러오기 (Ctrl+O)"><svg viewBox="0 0 20 20"><path d="M2.5 15.5V4.5h5l1.5 2h8v2 M2.5 15.5l2.2-7h13.8l-2.2 7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button type="button" class="tb" data-cmd="file.save" title="저장하기 (Ctrl+S)"><svg viewBox="0 0 20 20"><path d="M3.5 3.5h10.5l2.5 2.5v10.5h-13z M6.5 3.5v4.5h6.5V3.5 M6 16.5v-5.5h8v5.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button type="button" class="tb" data-cmd="file.print" title="인쇄 (Ctrl+P)"><svg viewBox="0 0 20 20"><path d="M5.5 7V3h9v4 M5.5 14h-3V7h15v7h-3 M5.5 11.5h9V17h-9z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="edit.undo" title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 20 20"><path d="M7.5 5L3.5 9l4 4 M4 9h7.5a4.5 4.5 0 0 1 0 9H9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="tb" data-cmd="edit.redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 20 20"><path d="M12.5 5l4 4-4 4 M16 9H8.5a4.5 4.5 0 0 0 0 9H11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="tb-group">
      <input id="tb-font" class="tb-input" list="font-list" title="글꼴" aria-label="글꼴" spellcheck="false" autocomplete="off">
      <datalist id="font-list"></datalist>
      <input id="tb-size" class="tb-input tb-size" list="size-list" title="글자 크기 (pt)" aria-label="글자 크기" inputmode="decimal" autocomplete="off">
      <datalist id="size-list">
        <option value="8"></option><option value="9"></option><option value="10"></option><option value="11"></option><option value="12"></option>
        <option value="13"></option><option value="14"></option><option value="15"></option><option value="16"></option><option value="18"></option>
        <option value="20"></option><option value="22"></option><option value="24"></option><option value="28"></option><option value="32"></option>
        <option value="36"></option><option value="48"></option><option value="72"></option>
      </datalist>
    </div>
    <div class="tb-group">
      <button type="button" class="tb tb-toggle" data-cmd="format.bold" title="진하게 (Ctrl+B)"><b>가</b></button>
      <button type="button" class="tb tb-toggle" data-cmd="format.italic" title="기울임 (Ctrl+I)"><i>가</i></button>
      <button type="button" class="tb tb-toggle" data-cmd="format.underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
      <button type="button" class="tb tb-toggle" data-cmd="format.strike" title="취소선"><s>가</s></button>
      <label class="tb tb-color" title="글자 색"><span class="color-glyph">가</span><span class="color-bar" id="tb-color-bar"></span><input type="color" id="tb-color" value="#000000" aria-label="글자 색"></label>
      <label class="tb tb-color" title="형광펜(음영) 색"><span class="color-glyph hl">가</span><span class="color-bar" id="tb-shade-bar"></span><input type="color" id="tb-shade" value="#ffff00" aria-label="음영 색"></label>
      <button type="button" class="tb" data-cmd="format.noShade" title="음영 없애기"><svg viewBox="0 0 20 20"><path d="M4 16L16 4 M5.5 4.5h9v9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb tb-toggle" data-cmd="para.align.justify" title="양쪽 정렬"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 8.5h14M3 12h14M3 15.5h14" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button type="button" class="tb tb-toggle" data-cmd="para.align.left" title="왼쪽 정렬"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 8.5h9M3 12h14M3 15.5h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button type="button" class="tb tb-toggle" data-cmd="para.align.center" title="가운데 정렬"><svg viewBox="0 0 20 20"><path d="M3 5h14M5.5 8.5h9M3 12h14M5.5 15.5h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button type="button" class="tb tb-toggle" data-cmd="para.align.right" title="오른쪽 정렬"><svg viewBox="0 0 20 20"><path d="M3 5h14M8 8.5h9M3 12h14M8 15.5h9" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <select id="tb-spacing" class="tb-input tb-select" title="줄 간격" aria-label="줄 간격">
        <option value="">줄 간격</option>
        <option value="100">100%</option><option value="130">130%</option><option value="150">150%</option><option value="160">160%</option>
        <option value="180">180%</option><option value="200">200%</option><option value="250">250%</option><option value="300">300%</option>
      </select>
    </div>
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="insert.table" title="표 넣기"><svg viewBox="0 0 20 20"><path d="M3 4h14v12H3z M3 8h14 M3 12h14 M8 4v12 M12.5 4v12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button type="button" class="tb" data-cmd="insert.image" title="그림 넣기"><svg viewBox="0 0 20 20"><path d="M3 4h14v12H3z M3 14l4-4.5 3 3 2.5-2.5L17 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="13" cy="7.5" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" class="tb" data-cmd="edit.find" title="찾기 (Ctrl+F)"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12.5 12.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tb-group tb-right">
      <select id="tb-zoom" class="tb-input tb-select" title="확대/축소" aria-label="확대/축소">
        <option value="fit">폭 맞춤</option>
        <option value="50">50%</option><option value="75">75%</option><option value="100" selected>100%</option>
        <option value="125">125%</option><option value="150">150%</option><option value="200">200%</option>
      </select>
    </div>
  </div>

  <div id="findbar" hidden>
    <input id="find-text" type="text" placeholder="찾을 내용" aria-label="찾을 내용" spellcheck="false">
    <input id="replace-text" type="text" placeholder="바꿀 내용" aria-label="바꿀 내용" spellcheck="false">
    <button type="button" data-cmd="find.prev" title="이전 찾기 (Shift+Enter)">이전</button>
    <button type="button" data-cmd="find.next" title="다음 찾기 (Enter)">다음</button>
    <button type="button" data-cmd="find.replace">바꾸기</button>
    <button type="button" data-cmd="find.replaceAll">모두 바꾸기</button>
    <span id="find-status"></span>
    <button type="button" class="find-close" data-cmd="find.close" title="닫기 (Esc)">✕</button>
  </div>

  <main id="workspace" tabindex="-1">
    <div id="zoomer">
      <div id="doc" class="doc" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="문서 본문"></div>
    </div>
    <div id="welcome" hidden></div>
  </main>

  <footer id="statusbar">
    <span id="st-format"></span>
    <span id="st-info"></span>
    <span id="st-msg" role="status" aria-live="polite"></span>
    <span class="st-spacer"></span>
    <span id="st-state"></span>
  </footer>
</div>

<div id="overlay" hidden></div>
<input type="file" id="file-input" accept=".hwp,.hwpx" hidden>
<input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/bmp" hidden>
<script type="module" src="./app.js"></script>
</body>
</html>
