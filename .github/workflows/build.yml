name: build

# Windows 설치 파일(marohwp-Setup-<버전>.exe)을 만들고, 실제로 설치해서 스모크 테스트까지 돌린다.
# v* 태그를 올리면 같은 설치 파일로 GitHub Release 를 만든다.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows 설치 파일
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 소스 받기
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      # 태그 v1.2.3 으로 빌드할 때는 설치 파일/앱 버전을 태그에 맞춘다.
      - name: 태그 버전 반영
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' must look like v1.2.3"
          }
          npm pkg set "version=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "version = $version"

      - name: 설치 파일 빌드
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $found = @(Get-ChildItem -LiteralPath 'dist' -Filter 'marohwp-Setup-*.exe' -File)
          if ($found.Count -ne 1) {
            Get-ChildItem -LiteralPath 'dist' | Format-Table Name, Length | Out-String | Write-Host
            throw "Expected exactly one dist\marohwp-Setup-*.exe, found $($found.Count)"
          }
          $installer = $found[0].FullName
          Write-Host ("installer: {0} ({1:N1} MB)" -f $installer, ($found[0].Length / 1MB))
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 설치 + 스모크 테스트
        env:
          INSTALLER: ${{ steps.build.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # GUI 프로그램은 PowerShell 이 기다려 주지 않는다. Start-Process -PassThru 로 띄우고
          # 핸들을 잡아 둔 뒤(그래야 ExitCode 를 읽을 수 있다) 제한 시간과 함께 기다린다.
          function Invoke-Gui([string]$File, [string[]]$Arguments, [int]$TimeoutSeconds) {
            $p = Start-Process -FilePath $File -ArgumentList $Arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($TimeoutSeconds * 1000)) {
              cmd.exe /c "taskkill /F /T /PID $($p.Id) >nul 2>&1"
              return $null
            }
            $p.WaitForExit()
            return [int]$p.ExitCode
          }

          # 1) 조용히 설치 (/S). 한 번 클릭 설치 파일은 조용한 설치 뒤에 앱을 실행하지 않는다.
          if (-not (Test-Path -LiteralPath $env:INSTALLER -PathType Leaf)) { throw "Installer not found: $env:INSTALLER" }
          $code = Invoke-Gui $env:INSTALLER @('/S') 600
          if ($null -eq $code) { throw 'Installer did not finish within 10 minutes' }
          if ($code -ne 0) { throw "Installer exit code $code" }

          # 2) 설치 결과: 실행 파일, 바로 가기, 연결 프로그램 등록
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\marohwp'
          $exe = Join-Path $installDir 'marohwp.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            if (Test-Path -LiteralPath $installDir) { Get-ChildItem -LiteralPath $installDir | Out-String | Write-Host }
            throw "Installed executable not found: $exe"
          }
          Write-Host "installed: $exe"

          $info = (Get-Item -LiteralPath $exe).VersionInfo
          Write-Host "ProductName=$($info.ProductName) FileVersion=$($info.FileVersion)"
          if ($info.ProductName -ne 'marohwp') { throw "Unexpected ProductName '$($info.ProductName)' (exe resources were not edited)" }

          $shell = New-Object -ComObject WScript.Shell
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'marohwp.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'marohwp.lnk')
          )
          foreach ($lnk in $shortcuts) {
            if (-not (Test-Path -LiteralPath $lnk -PathType Leaf)) { throw "Shortcut not found: $lnk" }
            $target = $shell.CreateShortcut($lnk).TargetPath
            if ($target -ne $exe) { throw "Shortcut $lnk points to '$target', expected '$exe'" }
            Write-Host "shortcut ok: $lnk"
          }

          $openCommand = '"{0}" "%1"' -f $exe
          foreach ($key in @('marohwp.hwp', 'marohwp.hwpx', 'Applications\marohwp.exe')) {
            $path = "HKCU:\Software\Classes\$key\shell\open\command"
            if (-not (Test-Path -LiteralPath $path)) { throw "Registry key missing: $path" }
            $value = (Get-Item -LiteralPath $path).GetValue('')
            if ($value -ne $openCommand) { throw "Registry $path = '$value', expected '$openCommand'" }
          }
          foreach ($ext in @('hwp', 'hwpx')) {
            $extKey = Get-Item -LiteralPath "HKCU:\Software\Classes\.$ext"
            if ($null -ne $extKey.GetValue('')) { throw ".$ext default handler must not be changed (found '$($extKey.GetValue(''))')" }
            $names = (Get-Item -LiteralPath "HKCU:\Software\Classes\.$ext\OpenWithProgids").GetValueNames()
            if ($names -notcontains "marohwp.$ext") { throw ".$ext OpenWithProgids does not list marohwp.$ext" }
            $types = (Get-Item -LiteralPath 'HKCU:\Software\Classes\Applications\marohwp.exe\SupportedTypes').GetValueNames()
            if ($types -notcontains ".$ext") { throw "SupportedTypes does not list .$ext" }
          }
          Write-Host 'open-with registration ok'

          # 3) 스모크 테스트: marohwp.exe --smoke-test=<폴더> → smoke-result.json + 종료 코드
          Get-Process -Name 'marohwp' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $out = Join-Path $env:RUNNER_TEMP 'marohwp-smoke'
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $code = Invoke-Gui $exe @("--smoke-test=`"$out`"") 180

          $resultFile = Join-Path $out 'smoke-result.json'
          $result = $null
          if (Test-Path -LiteralPath $resultFile -PathType Leaf) {
            $result = Get-Content -LiteralPath $resultFile -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host '----- smoke log -----'
            Write-Host $result.log
            if ($result.console) {
              Write-Host '----- renderer console -----'
              $result.console | ForEach-Object { Write-Host $_ }
            }
            Write-Host '---------------------'
          } else {
            Write-Host "smoke-result.json was not written ($resultFile)"
          }
          if ($null -eq $code) { throw 'Smoke test did not exit within 180 seconds' }
          if ($null -eq $result) { throw "Smoke test wrote no result (exit code $code)" }
          if ($result.ok -ne $true -or $code -ne 0) { throw "Smoke test failed (ok=$($result.ok), exit code $code)" }
          Write-Host 'smoke test passed'

      - name: 설치 파일 올리기
        if: ${{ always() && hashFiles('dist/marohwp-Setup-*.exe') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: marohwp-Setup
          path: dist/marohwp-Setup-*.exe
          if-no-files-found: error
          compression-level: 0

      - name: 제거 확인
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\marohwp'
          $uninstaller = Join-Path $installDir 'Uninstall marohwp.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "Uninstaller not found: $uninstaller" }
          Get-Process -Name 'marohwp' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          # _?=<폴더> : 언인스톨러가 임시 폴더로 복사되어 따로 돌지 않고 이 프로세스에서 끝까지 실행된다.
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/S', "_?=$installDir") -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) {
            cmd.exe /c "taskkill /F /T /PID $($p.Id) >nul 2>&1"
            throw 'Uninstaller did not finish within 5 minutes'
          }
          $p.WaitForExit()
          Write-Host "uninstaller exit code: $($p.ExitCode)"

          # 판정은 종료 코드가 아니라 실제로 남은 것이 있는지로 한다.
          $leftovers = @()
          if (Test-Path -LiteralPath (Join-Path $installDir 'marohwp.exe')) { $leftovers += 'marohwp.exe' }
          foreach ($lnk in @(
              (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'marohwp.lnk'),
              (Join-Path ([Environment]::GetFolderPath('Programs')) 'marohwp.lnk'))) {
            if (Test-Path -LiteralPath $lnk) { $leftovers += $lnk }
          }
          foreach ($key in @('marohwp.hwp', 'marohwp.hwpx', 'Applications\marohwp.exe')) {
            if (Test-Path -LiteralPath "HKCU:\Software\Classes\$key") { $leftovers += "HKCU:\Software\Classes\$key" }
          }
          foreach ($ext in @('hwp', 'hwpx')) {
            $path = "HKCU:\Software\Classes\.$ext\OpenWithProgids"
            if ((Test-Path -LiteralPath $path) -and ((Get-Item -LiteralPath $path).GetValueNames() -contains "marohwp.$ext")) {
              $leftovers += "$path\marohwp.$ext"
            }
          }
          if ($leftovers.Count -gt 0) { throw ("Uninstall left behind: " + ($leftovers -join ', ')) }
          Write-Host 'uninstall ok'

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 설치 파일 받기
        uses: actions/download-artifact@v8
        with:
          name: marohwp-Setup
          path: dist

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/marohwp-Setup-*.exe --clobber
          else
            gh release create "$TAG" dist/marohwp-Setup-*.exe --title "marohwp ${TAG#v}" --generate-notes --verify-tag
          fi
